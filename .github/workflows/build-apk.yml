name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    # Permiso para publicar la versión en "Releases" (de ahí la lee el aviso de actualización)
    permissions:
      contents: write
    # Ubuntu 24.04 trae el SDK de Android preinstalado.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Verificar SDK de Android
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Preparar clave de firma (desde los secretos)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secreto KEYSTORE_BASE64 (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/gvlauncher.keystore"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/gvlauncher.keystore" >> "$GITHUB_ENV"
      - name: Compilar versión final (release)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
      - name: Comprobar la firma
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | head -3
          ls -lh app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v5
        with:
          name: grand-vitara-launcher-apk
          path: launcher/app/build/outputs/apk/release/app-release.apk
      - name: Publicar versión en GitHub (Releases)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "La v$VERSION ya está publicada; no se crea otra."
            exit 0
          fi
          cp app/build/outputs/apk/release/app-release.apk "grand-vitara-launcher-v$VERSION.apk"
          gh release create "v$VERSION" "grand-vitara-launcher-v$VERSION.apk" \
            --title "Grand Vitara Launcher v$VERSION" --notes-file NOVEDADES.md
