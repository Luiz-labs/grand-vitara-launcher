name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    # Permiso para publicar la versión en "Releases" (de ahí la lee el aviso de actualización)
    permissions:
      contents: write
    # Ubuntu 24.04 trae el SDK de Android preinstalado (ubuntu-latest ya migra a 26).
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Verificar SDK de Android
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v5
        with:
          name: grand-vitara-launcher-apk
          path: launcher/app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar versión en GitHub (Releases)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "La v$VERSION ya está publicada; no se crea otra."
            exit 0
          fi
          cp app/build/outputs/apk/debug/app-debug.apk "grand-vitara-launcher-v$VERSION.apk"
          gh release create "v$VERSION" "grand-vitara-launcher-v$VERSION.apk" \
            --title "Grand Vitara Launcher v$VERSION" --notes-file NOVEDADES.md
