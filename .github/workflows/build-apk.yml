name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    # Ubuntu 24.04 trae el SDK de Android preinstalado (ubuntu-latest ya migra a 26).
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Verificar SDK de Android
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v5
        with:
          name: grand-vitara-launcher-apk
          path: launcher/app/build/outputs/apk/debug/app-debug.apk
